#
# Standalone preview playbook. Builds a small sample site using this theme's
# unzipped sources, so the UI can be developed without the website repo.
#
#   gulp preview   (bundles, then builds this into preview-output/)
#
site:
  title: Website UI Preview
  start_page: preview::index.adoc

content:
  sources:
  # Read from the .preview-src snapshot, not preview/content directly: this repo
  # is a git worktree (its `.git` is a pointer file) which Antora's aggregator
  # cannot open. The `gulp previewSrc` task copies the *current* preview/content
  # working tree into .preview-src (a plain git repo) and commits it before each
  # build, so uncommitted content edits appear in the preview without a manual
  # commit. See gulpfile.js.
  - url: ./.preview-src
    branches: HEAD
    start_path: content

ui:
  bundle:
    # Resolved relative to this playbook file (the project root).
    url: ./dist/ui-bundle.zip
    snapshot: true

output:
  clean: true
  dir: preview-output

runtime:
  fetch: false
