#
# Standalone preview playbook. Builds a small sample site using this theme's
# unzipped sources, so the UI can be developed without the website repo.
#
#   gulp preview   (bundles, then builds this into preview-output/)
#

site:
  title: Website UI Preview
  start_page: preview::index.adoc

content:
  sources:

  # Read from the ./tmp snapshot, not ./srv/ directly.
  # The reason is, this repo is a Git worktree, which Antora's aggregator
  # cannot open.
  #
  # The `gulp previewSrc` task copies the current ./srv/ working tree
  # into ./tmp/, which is a plain Git repo. It commits the copied
  # files before each build – in effect, uncommitted content edits appear in
  # the preview without requiring a manual commit to the worktree repository.
  # It's hacky, but it works.
  #
  # See also gulpfile.js.

  - url: ./tmp
    branches: HEAD

ui:
  bundle:
    # Resolved relative to this playbook file (the project root).
    url: ./dist/ui-bundle.zip
    snapshot: true

output:
  clean: true
  dir: preview-output

runtime:
  fetch: false
